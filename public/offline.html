<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6741d9" />
    <title>Offline - FitTrack</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      /* Inlined rather than linked: the hashed stylesheet may not be cached
         when this page is the only thing left to serve. */
      :root {
        --surface-background: #f5f5f5;
        --surface-elevated: #ffffff;
        --surface-neutral: #f0f0f0;
        --text-primary: #1c1c1c;
        --text-secondary: #555;
        --border-subtle: #e4e4e4;
        --accent-primary: #6741d9;
        --accent-primary-hover: #5b34c7;
      }

      [data-theme='dark'] {
        --surface-background: #0d0d0d;
        --surface-elevated: #1a1a1a;
        --surface-neutral: #2a2a2a;
        --text-primary: #f0f0f0;
        --text-secondary: #999;
        --border-subtle: #333;
        --accent-primary: #9d7eff;
        --accent-primary-hover: #8b6eff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--surface-background);
        color: var(--text-primary);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        background: var(--surface-elevated);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 32px;
        max-width: 460px;
        width: 100%;
        text-align: center;
      }

      .icon {
        font-size: 3rem;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 8px;
      }

      p {
        color: var(--text-secondary);
        line-height: 1.6;
        margin: 0 0 20px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        background: var(--accent-primary);
        color: #fff;
        text-decoration: none;
      }

      .btn:hover {
        background: var(--accent-primary-hover);
      }

      .note {
        margin: 20px 0 0;
        padding-top: 16px;
        border-top: 1px solid var(--border-subtle);
        font-size: 0.8125rem;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📴</div>
      <h1>You're offline</h1>
      <p>
        This page hasn't been cached yet. Open FitTrack once while connected and
        your dashboard, food database, and recent logs will be available offline.
      </p>
      <button class="btn" type="button" onclick="window.location.reload()">Try again</button>
      <p class="note">
        Anything you log while offline is saved on this device and syncs
        automatically once you're back online.
      </p>
    </div>
    <script>
      (function () {
        var theme = localStorage.getItem('fittrack-theme') || 'light'
        document.documentElement.setAttribute('data-theme', theme)

        // Leave the fallback as soon as connectivity returns.
        window.addEventListener('online', function () {
          window.location.reload()
        })
      })()
    </script>
  </body>
</html>
